# =============================================================================
#  Hyprlock Configuration — Premium Frosted-Glass Theme
# =============================================================================

source = $HOME/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
    fail_timeout = 2000
}

# ── 1. Background: Dark Cinematic Frosted Glass (Live Blurred Snapshot) ──────
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.015
    contrast = 0.90
    brightness = 0.75
    vibrancy = 0.25
    vibrancy_darkness = 0.10
}

# ── 2. Main Card Container (Centered Translucent Glass Card) ─────────────────
shape {
    monitor =
    size = 500, 370
    color = $surface
    rounding = 24
    border_size = 1
    border_color = $outline
    xray = false
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(0, 0, 0, 0.45)
}

# ── 3. Clock (Large Prominent White Display) ──────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $on_surface
    font_size = 105
    font_family = Inter, Outfit, Roboto, Sans
    position = 0, 95
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.4)
}

# ── 4. Date Subtitle (Teal Accent with Letter Spacing) ────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = $primary_solid
    font_size = 18
    font_family = Inter, Outfit, Roboto, Sans
    position = 0, 32
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.3)
}

# ── 5. User Greeting & Subtitle ──────────────────────────────────────────────
label {
    monitor =
    text = Hi there, $USER
    color = $on_surface
    font_size = 16
    font_family = Inter, Outfit, Roboto, Sans
    position = 0, -15
    halign = center
    valign = center
}

label {
    monitor =
    text = Good to see you again
    color = $outline
    font_size = 12
    font_family = Inter, Outfit, Roboto, Sans
    position = 0, -34
    halign = center
    valign = center
}

# ── 6. Password Input Field (Pill Shape with Glowing Teal Accent) ─────────────
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    rounding = 25

    outer_color = $primary
    inner_color = $surface_container
    font_color = $on_surface
    check_color = $secondary
    fail_color = $error

    fade_on_empty = false
    placeholder_text = <span foreground="##dee4df88">󰌾   Enter Password...</span>
    fail_text = <i>Incorrect Password ($ATTEMPTS)</i>

    position = 0, -80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
}

# ── 7. Bottom System Controls inside Card ─────────────────────────────────────
label {
    monitor =
    text = ⏻    ↻    ☾
    color = $outline
    font_size = 19
    position = 0, -132
    halign = center
    valign = center
}

# ── 8. Bottom Ambient Accent Line & Quote ─────────────────────────────────────
label {
    monitor =
    text = ───
    color = $primary_solid
    font_size = 12
    position = 0, 50
    halign = center
    valign = bottom
}

label {
    monitor =
    text = A quiet mind is a more creative mind.
    color = $outline
    font_size = 13
    font_family = Inter, Outfit, Roboto, Sans
    position = 0, 28
    halign = center
    valign = bottom
}
