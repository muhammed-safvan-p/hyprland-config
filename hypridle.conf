# =============================================================================
#  Hypridle Configuration — Automatic Screen Lock & Power Management
# =============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock --grace 0  # avoids duplicate hyprlock instances and enforces zero grace
    before_sleep_cmd = loginctl lock-session    # lock before system sleep/suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display upon wake
    ignore_dbus_inhibit = false                 # respect media players / browsers inhibiting idle
}

# ── 1. Lock Screen after 5 Minutes (300s) ─────────────────────────────────────
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# ── 2. Turn Off Displays after 10 Minutes (600s) ──────────────────────────────
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
